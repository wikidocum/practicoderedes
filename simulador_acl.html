<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador de ACL Cisco (Evaluación en Texto CLI)</title>

  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --accent-blue: #38bdf8;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --accent-purple: #a855f7;
      --accent-yellow: #f59e0b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: 16px;
      min-height: 100vh;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid var(--card-border);
    }

    h1 {
      font-size: 1.5rem;
      color: var(--accent-blue);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 16px;
    }

    .scenario-selector {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn-scenario {
      background: #0f172a;
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
    }

    .btn-scenario:hover,
    .btn-scenario.active {
      border-color: var(--accent-blue);
      background: #1e3a8a;
      color: #fff;
    }

    .vertical-layout {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .panel {
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--card-border);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .panel-title {
      font-size: 1.05rem;
      color: var(--accent-blue);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 8px;
    }

    .config-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    @media (min-width: 768px) {
      .config-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .cli-box {
      background: #090d16;
      border-radius: 8px;
      padding: 12px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.85rem;
      border-left: 4px solid var(--accent-blue);
      color: #38bdf8;
      overflow-x: auto;
      white-space: pre-wrap;
      line-height: 1.4;
    }

    .cli-interface {
      color: var(--accent-purple);
      font-weight: bold;
    }

    .interface-config {
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .form-group label {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .form-control {
      background: #1e293b;
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
    }

    .router-viz {
      background: #090d16;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 12px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .router-icon {
      background: #1e3a8a;
      color: #38bdf8;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.85rem;
      border: 1px solid var(--accent-blue);
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .direction-badge {
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: bold;
    }

    .badge-in {
      background: rgba(56, 189, 248, 0.2);
      color: var(--accent-blue);
      border: 1px solid var(--accent-blue);
    }

    .badge-out {
      background: rgba(168, 85, 247, 0.2);
      color: var(--accent-purple);
      border: 1px solid var(--accent-purple);
    }

    .rules-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 180px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .rule-item {
      background: #0f172a;
      border: 1px solid var(--card-border);
      padding: 8px 10px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: monospace;
      font-size: 0.8rem;
    }

    .rule-action {
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .action-permit {
      background: rgba(34, 197, 94, 0.2);
      color: var(--accent-green);
    }

    .action-deny {
      background: rgba(239, 68, 68, 0.2);
      color: var(--accent-red);
    }

    .btn-del {
      background: transparent;
      border: none;
      color: var(--accent-red);
      cursor: pointer;
      font-size: 1rem;
    }

    .add-rule-form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      background: #0f172a;
      padding: 10px;
      border-radius: 8px;
      border: 1px dashed var(--card-border);
    }

    .full-width {
      grid-column: span 2;
    }

    .btn-add {
      grid-column: span 2;
      background: var(--accent-blue);
      color: #000;
      border: none;
      padding: 8px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .tester-box {
      background: #0f172a;
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .tester-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 8px;
    }

    .btn-run {
      background: var(--accent-green);
      color: #000;
      font-weight: bold;
      border: none;
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .console-terminal {
      background: #000000;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 16px;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 0.9rem;
      min-height: 250px;
      max-height: 400px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .log-line {
      padding: 6px 10px;
      border-radius: 4px;
      line-height: 1.5;
      border-left: 3px solid transparent;
      opacity: 0.85;
      transition: all 0.2s ease;
    }

    .log-header {
      color: #38bdf8;
      border-left-color: #38bdf8;
      background: rgba(56, 189, 248, 0.05);
    }

    .log-eval {
      color: #f59e0b;
      border-left-color: #f59e0b;
      background: rgba(245, 158, 11, 0.05);
    }

    .log-pass {
      color: #ef4444;
      border-left-color: #ef4444;
      background: rgba(239, 68, 68, 0.05);
    }

    .log-match-permit {
      color: #4ade80;
      border-left-color: #22c55e;
      background: rgba(34, 197, 94, 0.15);
      font-weight: bold;
    }

    .log-match-deny {
      color: #f87171;
      border-left-color: #ef4444;
      background: rgba(239, 68, 68, 0.15);
      font-weight: bold;
    }

    .log-result {
      font-size: 1rem;
      padding: 10px;
      border-radius: 6px;
      margin-top: 6px;
      text-align: center;
    }

    .result-permit {
      background: #052e16;
      color: #4ade80;
      border: 1px solid #22c55e;
    }

    .result-deny {
      background: #450a0a;
      color: #f87171;
      border: 1px solid #ef4444;
    }
  </style>
</head>

<body>

<div class="container">

  <header>
    <h1>
      <span>🛡️</span>
      ACL Cisco
    </h1>

    <!-- <p class="subtitle">
      Configura la ACL arriba y observa el desglose paso a paso en texto plano abajo.
    </p> -->

    <div class="scenario-selector">
      <button class="btn-scenario active" onclick="loadScenario('std_host', this)">
        1. Estándar (Bloqueo Host)
      </button>

      <button class="btn-scenario" onclick="loadScenario('std_subnet', this)">
        2. Estándar (Subred)
      </button>

      <button class="btn-scenario" onclick="loadScenario('ext_web', this)">
        3. Extendida (Bloqueo Web)
      </button>

      <button class="btn-scenario" onclick="loadScenario('ext_ssh', this)">
        4. Extendida (Solo SSH)
      </button>
    </div>
  </header>


  <div class="vertical-layout">

    <div class="panel">

      <div class="panel-title">
        <span>⚙️ CONFIGURACIÓN</span>

        <span
          id="acl-type-badge"
          style="font-size: 0.75rem; background: var(--card-border); padding: 2px 8px; border-radius: 4px;">
          Estándar
        </span>
      </div>


      <div class="config-grid">

        <!-- COLUMNA IZQUIERDA -->
        <div style="display: flex; flex-direction: column; gap: 12px;">

          <div class="interface-config">

            <div class="form-group">
              <label>Interfaz del Router:</label>

              <select id="iface-name"
                      class="form-control"
                      onchange="updateInterfaceConfig()">

                <option value="GigabitEthernet0/0">
                  GigabitEthernet0/0 (LAN Principal)
                </option>

                <option value="GigabitEthernet0/1">
                  GigabitEthernet0/1 (DMZ / Servidores)
                </option>

                <option value="Serial0/0/0">
                  Serial0/0/0 (Enlace WAN / Internet)
                </option>

              </select>
            </div>


            <div class="form-group">

              <label>Dirección del Tráfico (Direction):</label>

              <select id="iface-dir"
                      class="form-control"
                      onchange="updateInterfaceConfig()">

                <option value="in">
                  Entrante (in) - Antes de enrutamiento
                </option>

                <option value="out">
                  Saliente (out) - Después de enrutamiento
                </option>

              </select>

            </div>

          </div>


          <div class="router-viz">

            <div class="router-icon">

              <span id="viz-iface-text">
                Gig0/0
              </span>

              <span id="viz-dir-badge"
                    class="direction-badge badge-in">
                INBOUND (in)
              </span>

            </div>

            <div
              style="font-size: 0.75rem; color: var(--text-muted);"
              id="viz-desc-text">

              El router filtrará los paquetes
              <b>antes</b>
              de tomar la decisión de enrutamiento.

            </div>

          </div>


          <div class="cli-box" id="cli-output"></div>

        </div>


        <!-- COLUMNA DERECHA -->
        <div style="display: flex; flex-direction: column; gap: 12px;">

          <div
            class="panel-title"
            style="border:none; padding:0; margin:0;">

            <span>📋 Reglas Activas</span>

          </div>


          <div
            class="rules-list"
            id="rules-container">
          </div>


          <div class="add-rule-form">

            <select
              id="new-action"
              class="form-control">

              <option value="deny">
                deny
              </option>

              <option value="permit">
                permit
              </option>

            </select>


            <select
              id="new-proto"
              class="form-control"
              style="display:none;">

              <option value="ip">
                ip (todo)
              </option>

              <option value="tcp">
                tcp
              </option>

              <option value="udp">
                udp
              </option>

              <option value="icmp">
                icmp
              </option>

            </select>


            <input
              type="text"
              id="new-src"
              class="form-control full-width"
              placeholder="Origen (ej: 192.168.10.25, 10.0.0.0/24 o any)">


            <input
              type="number"
              id="new-port"
              class="form-control full-width"
              placeholder="Puerto Destino (ej: 80, 22)"
              min="1"
              max="65535"
              style="display:none;">


            <button
              class="btn-add"
              onclick="addNewRule()">

              + Agregar Regla

            </button>

          </div>


          <div class="tester-box">

            <div class="tester-grid">

              <div class="form-group">

                <label>
                  IP Origen Paquete:
                </label>

                <input
                  type="text"
                  id="test-ip"
                  class="form-control"
                  value="192.168.10.25">

              </div>


              <div class="form-group">

                <label>
                  Interfaz de Tránsito:
                </label>

                <select
                  id="test-iface"
                  class="form-control">

                  <option value="GigabitEthernet0/0">
                    GigabitEthernet0/0
                  </option>

                  <option value="GigabitEthernet0/1">
                    GigabitEthernet0/1
                  </option>

                  <option value="Serial0/0/0">
                    Serial0/0/0
                  </option>

                </select>

              </div>


              <div
                class="form-group ext-field"
                style="display:none;">

                <label>
                  Protocolo:
                </label>

                <select
                  id="test-proto"
                  class="form-control">

                  <option value="tcp">
                    TCP
                  </option>

                  <option value="udp">
                    UDP
                  </option>

                  <option value="icmp">
                    ICMP
                  </option>

                </select>

              </div>


              <div
                class="form-group ext-field"
                style="display:none;">

                <label>
                  Puerto Destino:
                </label>

                <input
                  type="number"
                  id="test-port"
                  class="form-control"
                  value="80"
                  min="1"
                  max="65535">

              </div>


              <button
                class="btn-run"
                onclick="runSimulation()">

                ▶ Simular

              </button>

            </div>

          </div>

        </div>

      </div>

    </div>


    <!-- LOG -->
    <div class="panel">

      <div class="panel-title">

       <span>
          📄 RESULTADOS
        </span>

        <span
          id="eval-status"
          style="font-size:0.8rem; color: var(--text-muted);">

          Listo

        </span>

      </div>


      <div
        class="console-terminal"
        id="console-output">

        <div class="log-line log-header">
          &gt; Presiona "▶ Simular" para analizar el paquete de datos.
        </div>

      </div>

    </div>

  </div>

</div>


<script>

  /* ============================================================
     ESTADO
     ============================================================ */

  let aclState = {

    number: "10",

    type: "standard",

    interfaceName: "GigabitEthernet0/0",

    direction: "in",

    rules: [

      {
        id: 1,
        action: "deny",
        src: "192.168.10.25",
        proto: "ip",
        port: ""
      },

      {
        id: 2,
        action: "permit",
        src: "any",
        proto: "ip",
        port: ""
      }

    ]

  };


  /* ============================================================
     ESCENARIOS
     ============================================================ */

  const scenarios = {

    std_host: {

      number: "10",

      type: "standard",

      interfaceName: "GigabitEthernet0/0",

      direction: "in",

      rules: [

        {
          id: 1,
          action: "deny",
          src: "192.168.10.25",
          proto: "ip",
          port: ""
        },

        {
          id: 2,
          action: "permit",
          src: "any",
          proto: "ip",
          port: ""
        }

      ],

      testIP: "192.168.10.25",

      testIface: "GigabitEthernet0/0",

      proto: "tcp",

      port: "80"

    },


    std_subnet: {

      number: "20",

      type: "standard",

      interfaceName: "GigabitEthernet0/1",

      direction: "out",

      rules: [

        {
          id: 1,
          action: "deny",
          src: "10.0.0.0/24",
          proto: "ip",
          port: ""
        },

        {
          id: 2,
          action: "permit",
          src: "any",
          proto: "ip",
          port: ""
        }

      ],

      testIP: "10.0.0.50",

      testIface: "GigabitEthernet0/1",

      proto: "tcp",

      port: "80"

    },


    ext_web: {

      number: "100",

      type: "extended",

      interfaceName: "GigabitEthernet0/0",

      direction: "in",

      rules: [

        {
          id: 1,
          action: "deny",
          proto: "tcp",
          src: "192.168.1.0/24",
          port: "80"
        },

        {
          id: 2,
          action: "deny",
          proto: "tcp",
          src: "192.168.1.0/24",
          port: "443"
        },

        {
          id: 3,
          action: "permit",
          proto: "ip",
          src: "any",
          port: ""
        }

      ],

      testIP: "192.168.1.15",

      testIface: "GigabitEthernet0/0",

      proto: "tcp",

      port: "80"

    },


    ext_ssh: {

      number: "110",

      type: "extended",

      interfaceName: "Serial0/0/0",

      direction: "in",

      rules: [

        {
          id: 1,
          action: "permit",
          proto: "tcp",
          src: "192.168.100.5",
          port: "22"
        },

        {
          id: 2,
          action: "deny",
          proto: "ip",
          src: "any",
          port: ""
        }

      ],

      /*
       * Se prueba inicialmente el host que está permitido.
       */
      testIP: "192.168.100.5",

      testIface: "Serial0/0/0",

      proto: "tcp",

      port: "22"

    }

  };


  /* ============================================================
     UTILIDADES IP
     ============================================================ */

  function ipToNumber(ip) {

    const parts = ip.split('.').map(Number);

    return (
      ((parts[0] << 24) >>> 0) +
      ((parts[1] << 16) >>> 0) +
      ((parts[2] << 8) >>> 0) +
      (parts[3] >>> 0)
    ) >>> 0;

  }


  function numberToIP(num) {

    return [

      (num >>> 24) & 255,
      (num >>> 16) & 255,
      (num >>> 8) & 255,
      num & 255

    ].join('.');

  }


  function isValidIPv4(ip) {

    if (typeof ip !== 'string') {
      return false;
    }

    const parts = ip.trim().split('.');

    if (parts.length !== 4) {
      return false;
    }

    return parts.every(part => {

      if (part === '') {
        return false;
      }

      if (!/^\d+$/.test(part)) {
        return false;
      }

      const value = Number(part);

      return value >= 0 && value <= 255;

    });

  }


  /*
   * Convierte:
   *
   * 192.168.1.10
   * 192.168.1.0/24
   * any
   *
   * en una estructura normalizada.
   */

  function parseSource(src) {

    src = src.trim();

    if (src.toLowerCase() === 'any') {

      return {
        valid: true,
        any: true,
        ip: "0.0.0.0",
        prefix: 0,
        network: "0.0.0.0",
        wildcard: "255.255.255.255"
      };

    }


    let ip = src;
    let prefix = 32;


    if (src.includes('/')) {

      const parts = src.split('/');

      if (parts.length !== 2) {

        return {
          valid: false
        };

      }

      ip = parts[0];

      if (!/^\d+$/.test(parts[1])) {

        return {
          valid: false
        };

      }

      prefix = Number(parts[1]);

      if (prefix < 0 || prefix > 32) {

        return {
          valid: false
        };

      }

    }


    if (!isValidIPv4(ip)) {

      return {
        valid: false
      };

    }


    const ipNumber = ipToNumber(ip);

    let maskNumber;


    if (prefix === 0) {

      maskNumber = 0;

    } else {

      maskNumber =
        (0xFFFFFFFF << (32 - prefix)) >>> 0;

    }


    const wildcardNumber =
      (~maskNumber) >>> 0;


    const networkNumber =
      (ipNumber & maskNumber) >>> 0;


    return {

      valid: true,

      any: false,

      ip: ip,

      prefix: prefix,

      network: numberToIP(networkNumber),

      wildcard: numberToIP(wildcardNumber),

      networkNumber: networkNumber,

      maskNumber: maskNumber

    };

  }


  /*
   * Valida una dirección usada como origen.
   */

  function isValidSource(src) {

    return parseSource(src).valid;

  }


  /*
   * Convierte una fuente al formato Cisco.
   *
   * Ejemplos:
   *
   * any
   * host 192.168.1.10
   * 192.168.1.0 0.0.0.255
   */

  function sourceToCisco(src) {

    const parsed = parseSource(src);

    if (!parsed.valid) {
      return src;
    }

    if (parsed.any) {
      return "any";
    }

    if (parsed.prefix === 32) {
      return `host ${parsed.ip}`;
    }

    return `${parsed.network} ${parsed.wildcard}`;

  }


  /*
   * Valida una IP de prueba.
   */

  function isValidTestIP(ip) {

    return isValidIPv4(ip.trim());

  }


  /* ============================================================
     ESCENARIOS
     ============================================================ */

  function loadScenario(key, button) {

    document
      .querySelectorAll('.btn-scenario')
      .forEach(b => b.classList.remove('active'));

    if (button) {
      button.classList.add('active');
    }


    const sc = scenarios[key];

    aclState.number = sc.number;

    aclState.type = sc.type;

    aclState.interfaceName =
      sc.interfaceName;

    aclState.direction =
      sc.direction;

    aclState.rules =
      JSON.parse(JSON.stringify(sc.rules));


    document.getElementById('iface-name').value =
      sc.interfaceName;

    document.getElementById('iface-dir').value =
      sc.direction;

    document.getElementById('test-ip').value =
      sc.testIP;

    document.getElementById('test-iface').value =
      sc.testIface;

    document.getElementById('test-proto').value =
      sc.proto;

    document.getElementById('test-port').value =
      sc.port;


    document.getElementById('console-output').innerHTML = `
      <div class="log-line log-header">
        &gt; Escenario cargado. Presiona "▶ Simular".
      </div>
    `;

    document.getElementById('eval-status').innerText =
      "Listo";


    updateUI();

  }


  /* ============================================================
     INTERFAZ
     ============================================================ */

  function updateInterfaceConfig() {

    aclState.interfaceName =
      document.getElementById('iface-name').value;

    aclState.direction =
      document.getElementById('iface-dir').value;

    updateUI();

  }


  /* ============================================================
     ACTUALIZACIÓN DE UI
     ============================================================ */

  function updateUI() {

    const isExt =
      aclState.type === 'extended';


    document.getElementById('acl-type-badge').innerText =
      isExt
        ? 'Extendida (100-199)'
        : 'Estándar (1-99)';


    document
      .querySelectorAll('.ext-field')
      .forEach(el => {

        el.style.display =
          isExt ? 'flex' : 'none';

      });


    document.getElementById('new-proto').style.display =
      isExt ? 'block' : 'none';

    document.getElementById('new-port').style.display =
      isExt ? 'block' : 'none';


    document.getElementById('viz-iface-text').innerText =
      aclState.interfaceName;


    const badge =
      document.getElementById('viz-dir-badge');


    if (aclState.direction === 'in') {

      badge.innerText =
        'INBOUND (in)';

      badge.className =
        'direction-badge badge-in';

      document.getElementById('viz-desc-text').innerHTML =
        'El router filtra los paquetes <b>antes</b> de enrutar.';

    } else {

      badge.innerText =
        'OUTBOUND (out)';

      badge.className =
        'direction-badge badge-out';

      document.getElementById('viz-desc-text').innerHTML =
        'El router filtra los paquetes <b>después</b> de enrutar.';

    }


    renderCLI();

    renderRules();

  }


  /* ============================================================
     GENERACIÓN DEL CLI CISCO
     ============================================================ */

  function renderCLI() {

    const cliLines = [];


    aclState.rules.forEach(r => {

      const source =
        sourceToCisco(r.src);


      if (aclState.type === 'standard') {

        cliLines.push(
          `access-list ${aclState.number} ${r.action} ${source}`
        );

      } else {

        let line =
          `access-list ${aclState.number} ${r.action} ${r.proto} ${source} any`;


        if (
          (r.proto === 'tcp' || r.proto === 'udp') &&
          r.port
        ) {

          line += ` eq ${r.port}`;

        }


        cliLines.push(line);

      }

    });


    const interfaceBlock =
      `interface ${aclState.interfaceName}\n` +
      ` ip access-group ${aclState.number} ${aclState.direction}`;


    const cli =
      cliLines.join('\n') +
      '\n' +
      interfaceBlock;


    const cliOutput =
      document.getElementById('cli-output');


    /*
     * Se utiliza textContent para evitar interpretar
     * contenido ingresado por el usuario como HTML.
     *
     * Luego se reconstruye visualmente la sección interface.
     */

    cliOutput.innerHTML = '';


    const aclText =
      document.createElement('span');

    aclText.textContent =
      cliLines.join('\n') + '\n';


    const interfaceText =
      document.createElement('span');

    interfaceText.className =
      'cli-interface';

    interfaceText.textContent =
      interfaceBlock;


    cliOutput.appendChild(aclText);

    cliOutput.appendChild(interfaceText);

  }


  /* ============================================================
     LISTA DE REGLAS
     ============================================================ */

  function renderRules() {

    const container =
      document.getElementById('rules-container');


    container.innerHTML = '';


    aclState.rules.forEach((r, idx) => {

      const item =
        document.createElement('div');


      item.className =
        'rule-item';


      const actionClass =
        r.action === 'permit'
          ? 'action-permit'
          : 'action-deny';


      let detail;


      if (aclState.type === 'standard') {

        detail = r.src;

      } else {

        detail =
          `${r.proto.toUpperCase()} ${r.src}`;


        if (
          (r.proto === 'tcp' || r.proto === 'udp') &&
          r.port
        ) {

          detail += ` eq ${r.port}`;

        }

      }


      item.innerHTML = `
        <div>
          <span style="color:var(--text-muted); margin-right:6px;">
            #${idx + 1}
          </span>

          <span class="rule-action ${actionClass}">
            ${r.action.toUpperCase()}
          </span>

          <span style="margin-left:8px; color:#fff;">
            ${escapeHtml(detail)}
          </span>
        </div>

        <button
          class="btn-del"
          onclick="deleteRule(${r.id})">
          ✕
        </button>
      `;


      container.appendChild(item);

    });

  }


  /* ============================================================
     ESCAPE HTML
     ============================================================ */

  function escapeHtml(value) {

    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');

  }


  /* ============================================================
     AGREGAR REGLA
     ============================================================ */

  function addNewRule() {

    const action =
      document.getElementById('new-action').value;


    const srcInput =
      document.getElementById('new-src');


    const proto =
      document.getElementById('new-proto').value;


    const port =
      document.getElementById('new-port').value.trim();


    const src =
      srcInput.value.trim() || 'any';


    if (!isValidSource(src)) {

      alert(
        "⚠️ La dirección de origen no es válida.\n\n" +
        "Ejemplos válidos:\n" +
        "192.168.1.10\n" +
        "192.168.1.0/24\n" +
        "10.0.0.0/16\n" +
        "any"
      );

      return;

    }


    /*
     * Los puertos solo tienen sentido para TCP/UDP.
     */

    if (
      aclState.type === 'extended' &&
      port &&
      proto !== 'tcp' &&
      proto !== 'udp'
    ) {

      alert(
        "⚠️ Los puertos solo pueden utilizarse con TCP o UDP."
      );

      return;

    }


    if (port) {

      const portNumber =
        Number(port);


      if (
        !Number.isInteger(portNumber) ||
        portNumber < 1 ||
        portNumber > 65535
      ) {

        alert(
          "⚠️ El puerto debe estar entre 1 y 65535."
        );

        return;

      }

    }


    aclState.rules.push({

      id: Date.now(),

      action: action,

      src: src,

      proto:
        aclState.type === 'extended'
          ? proto
          : 'ip',

      port:
        aclState.type === 'extended' &&
        (proto === 'tcp' || proto === 'udp')
          ? port
          : ''

    });


    srcInput.value = '';

    document.getElementById('new-port').value = '';


    updateUI();

  }


  /* ============================================================
     ELIMINAR REGLA
     ============================================================ */

  function deleteRule(id) {

    aclState.rules =
      aclState.rules.filter(
        r => r.id !== id
      );


    updateUI();

  }


  /* ============================================================
     LOG
     ============================================================ */

  function appendLogLine(text, typeClass) {

    const consoleEl =
      document.getElementById('console-output');


    const line =
      document.createElement('div');


    line.className =
      `log-line ${typeClass}`;


    line.textContent =
      text;


    consoleEl.appendChild(line);


    consoleEl.scrollTop =
      consoleEl.scrollHeight;

  }


  /* ============================================================
     EVALUACIÓN DE IP
     ============================================================ */

  function evaluateIP(rule, packetIP) {

    const parsed =
      parseSource(rule.src);


    if (!parsed.valid) {

      return {

        match: false,

        reason: "Origen de regla inválido."

      };

    }


    if (parsed.any) {

      return {

        match: true,

        reason: "Origen = any"

      };

    }


    const packetNumber =
      ipToNumber(packetIP);


    if (parsed.prefix === 32) {

      const match =
        packetNumber ===
        parsed.networkNumber;


      return {

        match: match,

        reason: match
          ? `IP ${packetIP} coincide con host ${parsed.ip}`
          : `IP ${packetIP} no coincide con host ${parsed.ip}`

      };

    }


    const match =
      (
        packetNumber &
        parsed.maskNumber
      ) >>> 0
      === parsed.networkNumber;


    return {

      match: match,

      reason: match

        ? `IP ${packetIP} pertenece a ${parsed.network}/${parsed.prefix}`

        : `IP ${packetIP} no pertenece a ${parsed.network}/${parsed.prefix}`

    };

  }


  /* ============================================================
     EVALUACIÓN DE PROTOCOLO
     ============================================================ */

  function evaluateProtocol(rule, packetProto) {

    /*
     * "ip" representa cualquier protocolo IP.
     */

    if (rule.proto === 'ip') {

      return {

        match: true,

        reason: "Protocolo ip = cualquier tráfico IP"

      };

    }


    const match =
      rule.proto === packetProto;


    return {

      match: match,

      reason: match

        ? `Protocolo ${packetProto.toUpperCase()} coincide`

        : `Protocolo ${packetProto.toUpperCase()} no coincide con ${rule.proto.toUpperCase()}`

    };

  }


  /* ============================================================
     EVALUACIÓN DE PUERTO
     ============================================================ */

  function evaluatePort(rule, packetProto, packetPort) {

    /*
     * Si la regla no tiene puerto,
     * cualquier puerto es aceptado.
     */

    if (!rule.port) {

      return {

        match: true,

        reason: "Sin restricción de puerto"

      };

    }


    /*
     * Solo TCP y UDP tienen puerto
     * en este simulador.
     */

    if (
      rule.proto !== 'tcp' &&
      rule.proto !== 'udp'
    ) {

      return {

        match: false,

        reason: "La regla especifica un puerto para un protocolo sin puertos"

      };

    }


    if (
      packetProto !== 'tcp' &&
      packetProto !== 'udp'
    ) {

      return {

        match: false,

        reason: "El paquete no utiliza TCP/UDP"

      };

    }


    const match =
      Number(rule.port) ===
      Number(packetPort);


    return {

      match: match,

      reason: match

        ? `Puerto destino ${packetPort} coincide`

        : `Puerto destino ${packetPort} no coincide con ${rule.port}`

    };

  }


  /* ============================================================
     EVALUACIÓN COMPLETA DE REGLA
     ============================================================ */

  function checkMatch(
    rule,
    ip,
    proto,
    port
  ) {

    /*
     * ACL ESTÁNDAR
     *
     * Solo se evalúa la IP de origen.
     */

    if (aclState.type === 'standard') {

      return evaluateIP(rule, ip);

    }


    /*
     * ACL EXTENDIDA
     *
     * IP + protocolo + puerto.
     */

    const ipResult =
      evaluateIP(rule, ip);


    if (!ipResult.match) {

      return {

        match: false,

        reason:
          `IP: ${ipResult.reason}`

      };

    }


    const protoResult =
      evaluateProtocol(rule, proto);


    if (!protoResult.match) {

      return {

        match: false,

        reason:
          `IP OK. ${protoResult.reason}`

      };

    }


    const portResult =
      evaluatePort(
        rule,
        proto,
        port
      );


    if (!portResult.match) {

      return {

        match: false,

        reason:
          `IP OK. Protocolo OK. ${portResult.reason}`

      };

    }


    return {

      match: true,

      reason:
        `IP OK. ${protoResult.reason}. ${portResult.reason}`

    };

  }


  /* ============================================================
     SIMULACIÓN
     ============================================================ */

  function runSimulation() {

    const testIP =
      document.getElementById('test-ip').value.trim();


    const testIface =
      document.getElementById('test-iface').value;


    const testProto =
      document.getElementById('test-proto').value.toLowerCase();


    const testPort =
      document.getElementById('test-port').value;


    const consoleEl =
      document.getElementById('console-output');


    const statusEl =
      document.getElementById('eval-status');


    if (!isValidTestIP(testIP)) {

      alert(
        "⚠️ La IP del paquete a probar no es válida."
      );

      return;

    }


    if (
      aclState.type === 'extended' &&
      (
        testProto === 'tcp' ||
        testProto === 'udp'
      )
    ) {

      const portNumber =
        Number(testPort);


      if (
        !Number.isInteger(portNumber) ||
        portNumber < 1 ||
        portNumber > 65535
      ) {

        alert(
          "⚠️ El puerto de prueba debe estar entre 1 y 65535."
        );

        return;

      }

    }


    consoleEl.innerHTML = '';

    statusEl.innerText =
      "Evaluando...";


    appendLogLine(
      `[PAQUETE RECIBIDO] IP Origen: ${testIP} | Interfaz Tránsito: ${testIface}` +
      (
        aclState.type === 'extended'
          ? ` | Protocolo: ${testProto.toUpperCase()} | Puerto Destino: ${testPort}`
          : ''
      ),
      'log-header'
    );


    /*
     * PRIMERA COMPROBACIÓN:
     * ¿El paquete está pasando por la interfaz
     * donde está aplicada la ACL?
     */

    if (
      testIface !==
      aclState.interfaceName
    ) {

      setTimeout(() => {

        appendLogLine(
          `⚙️ [EVALUACIÓN INTERFAZ] La ACL ${aclState.number} está asignada a ${aclState.interfaceName} (${aclState.direction.toUpperCase()}). El paquete transita por ${testIface}.`,
          'log-eval'
        );

      }, 300);


      setTimeout(() => {

        appendLogLine(
          `🟢 [ACCIÓN] La ACL no aplica a esta interfaz. El paquete pasa sin ser inspeccionado.`,
          'log-match-permit'
        );


        appendLogLine(
          `✅ RESULTADO FINAL: PERMITIDO (Tráfico no filtrado en esta interfaz)`,
          'log-result result-permit'
        );


        statusEl.innerText =
          "Permitido";

      }, 700);


      return;

    }


    setTimeout(() => {

      appendLogLine(
        `⚙️ [INICIO INSPECCIÓN] Paquete ingresa a la interfaz ${aclState.interfaceName} (${aclState.direction.toUpperCase()}). Evaluando ACL ${aclState.number} línea por línea...`,
        'log-header'
      );

    }, 300);


    let matched = false;

    let delay = 600;


    /*
     * Evaluamos las reglas en orden.
     *
     * First Match:
     * cuando una regla coincide,
     * las siguientes ya no se evalúan.
     */

    aclState.rules.forEach((r, idx) => {

      setTimeout(() => {

        if (matched) {
          return;
        }


        const evaluation =
          checkMatch(
            r,
            testIP,
            testProto,
            testPort
          );


        let ruleDesc;


        if (aclState.type === 'standard') {

          ruleDesc =
            `Origen = ${r.src}`;

        } else {

          ruleDesc =
            `${r.proto.toUpperCase()} ` +
            `Origen = ${r.src}`;

          if (
            (r.proto === 'tcp' ||
             r.proto === 'udp') &&
            r.port
          ) {

            ruleDesc +=
              ` | Puerto Destino = ${r.port}`;

          }

        }


        appendLogLine(
          `🔍 [REGLA #${idx + 1}] Evaluando: "access-list ${aclState.number} ${r.action} ${ruleDesc}"`,
          'log-eval'
        );


        appendLogLine(
          `   ↳ ${evaluation.reason}`,
          evaluation.match
            ? 'log-match-permit'
            : 'log-pass'
        );


        if (evaluation.match) {

          matched = true;


          const matchClass =
            r.action === 'permit'
              ? 'log-match-permit'
              : 'log-match-deny';


          const resultClass =
            r.action === 'permit'
              ? 'result-permit'
              : 'result-deny';


          appendLogLine(
            `🎯 [COINCIDENCIA ENCONTRADA] El paquete coincide con la Regla #${idx + 1} [${r.action.toUpperCase()}]. Evaluación finalizada (First Match).`,
            matchClass
          );


          appendLogLine(
            r.action === 'permit'
              ? `✅ RESULTADO FINAL: PERMITIDO (Procesado por Regla #${idx + 1})`
              : `🚫 RESULTADO FINAL: DENEGADO (Procesado por Regla #${idx + 1})`,
            `log-result ${resultClass}`
          );


          statusEl.innerText =
            r.action === 'permit'
              ? 'Permitido'
              : 'Denegado';

        } else {

          appendLogLine(
            `❌ [SIN COINCIDENCIA] No coincide con la Regla #${idx + 1}. Continuando a la siguiente línea...`,
            'log-pass'
          );

        }

      }, delay);


      delay += 700;

    });


    /*
     * Si ninguna regla coincidió:
     *
     * implicit deny
     */

    setTimeout(() => {

      if (!matched) {

        appendLogLine(
          `🔍 [REGLA IMPLÍCITA] Ninguna regla explícita coincidió. Evaluando la regla final invisible: "deny any"`,
          'log-eval'
        );


        appendLogLine(
          `🔒 [DENIED BY DEFAULT] Aplicando la Denegación Implícita de Cisco (Implicit Deny).`,
          'log-match-deny'
        );


        appendLogLine(
          `🚫 RESULTADO FINAL: DENEGADO (Implicit Deny)`,
          'log-result result-deny'
        );


        statusEl.innerText =
          "Denegado";

      }

    }, delay);

  }


  /* ============================================================
     INICIALIZACIÓN
     ============================================================ */

  updateUI();

</script>

</body>
</html>
