<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ACL Cisco — Simulador</title>

<style>

:root {
  --bg-dark: #0f172a;
  --card-bg: #1e293b;
  --card-border: #334155;
  --accent-blue: #38bdf8;
  --accent-green: #22c55e;
  --accent-red: #ef4444;
  --accent-purple: #a855f7;
  --accent-yellow: #f59e0b;
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg-dark);
  color: var(--text-main);
  font-family: Arial, Helvetica, sans-serif;
}

header {
  background: #020617;
  border-bottom: 1px solid var(--card-border);
  padding: 18px 25px;
  font-size: 24px;
  font-weight: bold;
}

.container {
  max-width: 1400px;
  margin: auto;
  padding: 20px;
}

h2 {
  margin-top: 0;
}

h3 {
  margin-top: 0;
  color: var(--accent-blue);
}

.card {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 10px;
  padding: 18px;
  margin-bottom: 20px;
}

.scenario-buttons {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
}

button {
  border: none;
  border-radius: 6px;
  padding: 9px 13px;
  cursor: pointer;
  font-weight: bold;
}

.scenario-btn {
  background: #334155;
  color: white;
}

.scenario-btn.active {
  background: var(--accent-blue);
  color: #082f49;
}

.main-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

label {
  display: block;
  color: var(--text-muted);
  margin-bottom: 5px;
  font-size: 14px;
}

input,
select {
  width: 100%;
  background: #0f172a;
  color: white;
  border: 1px solid #475569;
  border-radius: 6px;
  padding: 9px;
}

button.primary {
  background: var(--accent-blue);
  color: #082f49;
}

button.green {
  background: var(--accent-green);
  color: #052e16;
}

button.small {
  padding: 5px 8px;
  font-size: 12px;
}

.cli {
  background: #020617;
  border: 1px solid #334155;
  border-radius: 8px;
  padding: 15px;
  font-family: Consolas, monospace;
  white-space: pre-wrap;
  color: #86efac;
  min-height: 130px;
}

.rule {
  display: grid;
  grid-template-columns: 45px 1fr auto;
  gap: 10px;
  align-items: center;
  background: #0f172a;
  border: 1px solid #334155;
  border-radius: 7px;
  padding: 10px;
  margin-bottom: 8px;
}

.rule-number {
  color: var(--accent-yellow);
  font-weight: bold;
}

.rule-text {
  font-family: Consolas, monospace;
}

.rule-actions {
  display: flex;
  gap: 4px;
}

.rule-actions button {
  background: #334155;
  color: white;
}

.rule-actions button:hover {
  background: #475569;
}

.add-rule {
  margin-top: 15px;
  border-top: 1px solid #334155;
  padding-top: 15px;
}

.packet-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}

.path {
  margin-top: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
}

.path-node {
  background: #0f172a;
  border: 1px solid #475569;
  border-radius: 7px;
  padding: 10px;
  text-align: center;
  min-width: 130px;
}

.path-arrow {
  color: var(--accent-blue);
  font-size: 22px;
}

.results {
  background: #020617;
  border: 1px solid #334155;
  border-radius: 8px;
  padding: 15px;
  font-family: Consolas, monospace;
  min-height: 220px;
}

.log-line {
  margin: 5px 0;
}

.log-eval {
  color: #cbd5e1;
}

.log-match {
  color: var(--accent-yellow);
}

.log-match-permit {
  color: var(--accent-green);
  font-weight: bold;
}

.log-match-deny {
  color: var(--accent-red);
  font-weight: bold;
}

@media (max-width: 900px) {

  .main-grid,
  .packet-grid {
    grid-template-columns: 1fr;
  }

}

</style>
</head>

<body>

<header>
  🛡️ ACL Cisco — Simulador
</header>


<div class="container">


  <!-- =====================================================
       ESCENARIOS
  ====================================================== -->

  <div class="card">

    <h2>ESCENARIO</h2>

    <div class="scenario-buttons">

      <button
        id="scenarioStandard"
        class="scenario-btn active"
        onclick="loadScenario('standard', this)">
        ACL Estándar
      </button>

      <button
        id="scenarioExtended"
        class="scenario-btn"
        onclick="loadScenario('extended', this)">
        ACL Extendida
      </button>

    </div>

  </div>


  <!-- =====================================================
       CONFIGURACIÓN
  ====================================================== -->

  <div class="card">

    <h2>CONFIGURACIÓN</h2>

    <div class="main-grid">


      <!-- CONFIGURACIÓN ACL -->

      <div>

        <div class="form-grid">


          <div>

            <label>
              Número ACL
            </label>

            <input
              id="aclNumber"
              type="number"
              min="1"
              max="2699"
              step="1">

          </div>


          <div>

            <label>
              Tipo
            </label>

            <input
              id="aclType"
              type="text"
              readonly>

          </div>


          <div>

            <label>
              Interfaz
            </label>

            <select id="interfaceName">

              <option value="Serial0/0/0">
                Serial0/0/0 — INTERNET
              </option>

              <option value="FastEthernet0/0">
                FastEthernet0/0 — LAN
              </option>

              <option value="FastEthernet0/1">
                FastEthernet0/1 — DMZ / SERVIDORES
              </option>

            </select>

          </div>


          <div>

            <label>
              Dirección
            </label>

            <select id="direction">

              <option value="in">
                IN
              </option>

              <option value="out">
                OUT
              </option>

            </select>

          </div>


        </div>


        <h3 style="margin-top:25px;">
          CLI GENERADO
        </h3>


        <div
          id="cliOutput"
          class="cli">
        </div>


      </div>


      <!-- =================================================
           REGLAS
      ================================================== -->

      <div>

        <h3>
          REGLAS ACTIVAS
        </h3>


        <div id="rulesContainer"></div>


        <div class="add-rule">

          <h3>
            Agregar regla
          </h3>


          <div class="form-grid">


            <!-- ACCIÓN -->

            <div>

              <label>
                Acción
              </label>

              <select id="ruleAction">

                <option value="deny">
                  deny
                </option>

                <option value="permit">
                  permit
                </option>

              </select>

            </div>


            <!-- ORIGEN -->

            <div>

              <label>
                IP origen host / red
              </label>

              <input
                id="ruleSrc"
                type="text"
                placeholder="192.168.10.25 o 192.168.10.0/24">

            </div>


            <!-- PROTOCOLO -->

            <div id="protocolContainer">

              <label>
                Protocolo
              </label>

              <select
                id="ruleProto"
                onchange="updateRuleForm()">

                <option value="ip">
                  ip
                </option>

                <option value="tcp">
                  tcp
                </option>

                <option value="udp">
                  udp
                </option>

                <option value="icmp">
                  icmp
                </option>

              </select>

            </div>


            <!-- DESTINO -->

            <div id="destinationContainer">

              <label>
                IP destino / red
              </label>

              <input
                id="ruleDst"
                type="text"
                placeholder="10.0.0.10 o 10.0.0.0/24">

            </div>


            <!-- PUERTO -->

            <div id="portContainer">

              <label>
                Puerto destino
              </label>

              <input
                id="rulePort"
                type="number"
                min="1"
                max="65535"
                step="1"
                placeholder="80">

            </div>


          </div>


          <button
            class="green"
            style="margin-top:12px;"
            onclick="addRule()">

            + Agregar regla

          </button>


        </div>


      </div>


    </div>

  </div>


  <!-- =====================================================
       PRUEBA DE PAQUETE
  ====================================================== -->

  <div class="card">

    <h2>
      PRUEBA DE PAQUETE
    </h2>


    <div class="packet-grid">


      <div>

        <label>
          IP origen
        </label>

        <input
          id="testIP"
          type="text">

      </div>


      <div>

        <label>
          IP destino
        </label>

        <input
          id="testDstIP"
          type="text">

      </div>


      <div>

        <label>
          Interfaz de entrada
        </label>

        <select id="testInIface">

          <option value="Serial0/0/0">
            Serial0/0/0 — INTERNET
          </option>

          <option value="FastEthernet0/0">
            FastEthernet0/0 — LAN
          </option>

          <option value="FastEthernet0/1">
            FastEthernet0/1 — DMZ / SERVIDORES
          </option>

        </select>

      </div>


      <div>

        <label>
          Interfaz de salida
        </label>

        <select id="testOutIface">

          <option value="Serial0/0/0">
            Serial0/0/0 — INTERNET
          </option>

          <option value="FastEthernet0/0">
            FastEthernet0/0 — LAN
          </option>

          <option value="FastEthernet0/1">
            FastEthernet0/1 — DMZ / SERVIDORES
          </option>

        </select>

      </div>


      <div>

        <label>
          Protocolo
        </label>

        <select id="testProto">

          <option value="tcp">
            TCP
          </option>

          <option value="udp">
            UDP
          </option>

          <option value="icmp">
            ICMP
          </option>

        </select>

      </div>


      <div id="testPortContainer">

        <label>
          Puerto destino
        </label>

        <input
          id="testPort"
          type="number"
          min="1"
          max="65535"
          step="1"
          placeholder="80">

      </div>


    </div>


    <button
      class="primary"
      style="margin-top:15px;"
      onclick="runSimulation()">

      ▶ Simular paquete

    </button>


    <div
      id="packetPath"
      class="path">
    </div>


  </div>


  <!-- =====================================================
       RESULTADOS
  ====================================================== -->

  <div class="card">

    <h2>
      RESULTADOS
    </h2>

    <div
      id="results"
      class="results">
    </div>

  </div>


</div>


<script>


/* =========================================================
   ESTADO
========================================================= */

let aclState = {

  number: "10",

  type: "standard",

  interfaceName:
    "FastEthernet0/0",

  direction:
    "in",

  rules: [

    {
      id: 1,
      action: "deny",
      src: "192.168.10.25",
      dst: "any",
      proto: "ip",
      port: ""
    },

    {
      id: 2,
      action: "permit",
      src: "any",
      dst: "any",
      proto: "ip",
      port: ""
    }

  ]

};


/* =========================================================
   ESCENARIOS
========================================================= */

const scenarios = {


  /* ACL ESTÁNDAR */

  standard: {

    number: "10",

    type: "standard",

    interfaceName:
      "FastEthernet0/0",

    direction:
      "in",

    rules: [

      {
        id: 1,
        action: "deny",
        src: "192.168.10.25",
        dst: "any",
        proto: "ip",
        port: ""
      },

      {
        id: 2,
        action: "permit",
        src: "any",
        dst: "any",
        proto: "ip",
        port: ""
      }

    ],

    testIP:
      "192.168.10.25",

    testDstIP:
      "10.0.0.10",

    testInIface:
      "FastEthernet0/0",

    testOutIface:
      "FastEthernet0/1",

    proto:
      "tcp",

    port:
      "80"

  },


  /* ACL EXTENDIDA */

  extended: {

    number: "100",

    type: "extended",

    interfaceName:
      "FastEthernet0/0",

    direction:
      "in",

    rules: [

      {
        id: 1,
        action: "deny",
        proto: "tcp",
        src: "192.168.10.0/24",
        dst: "host 10.0.0.10",
        port: "80"
      },

      {
        id: 2,
        action: "deny",
        proto: "tcp",
        src: "192.168.10.0/24",
        dst: "host 10.0.0.10",
        port: "443"
      },

      {
        id: 3,
        action: "permit",
        proto: "ip",
        src: "any",
        dst: "any",
        port: ""
      }

    ],

    testIP:
      "192.168.10.25",

    testDstIP:
      "10.0.0.10",

    testInIface:
      "FastEthernet0/0",

    testOutIface:
      "FastEthernet0/1",

    proto:
      "tcp",

    port:
      "80"

  }

};


/* =========================================================
   VALIDACIÓN IPv4
========================================================= */

function isValidIPv4(ip) {

  const parts =
    ip.split(".");

  return (

    parts.length === 4 &&

    parts.every(function(part) {

      return (

        /^\d+$/.test(part) &&

        Number(part) >= 0 &&

        Number(part) <= 255

      );

    })

  );

}


/* =========================================================
   VALIDAR ORIGEN / DESTINO
========================================================= */

function isValidAddress(value) {

  if (value === "any") {

    return true;

  }


  if (value.startsWith("host ")) {

    const ip =
      value.substring(5).trim();

    return isValidIPv4(ip);

  }


  if (value.includes("/")) {

    const parts =
      value.split("/");


    if (parts.length !== 2) {

      return false;

    }


    const ip =
      parts[0];

    const prefix =
      Number(parts[1]);


    return (

      isValidIPv4(ip) &&

      Number.isInteger(prefix) &&

      prefix >= 0 &&

      prefix <= 32

    );

  }


  return isValidIPv4(value);

}


/* =========================================================
   IP A ENTERO
========================================================= */

function ipToInt(ip) {

  return ip

    .split(".")

    .reduce(

      (number, octet) =>
        (number * 256) +
        Number(octet),

      0

    ) >>> 0;

}


/* =========================================================
   MATCH IP
========================================================= */

function matchAddress(ip, source) {


  if (source === "any") {

    return true;

  }


  if (source.startsWith("host ")) {

    return (

      ip ===
      source.substring(5).trim()

    );

  }


  if (source.includes("/")) {

    const parts =
      source.split("/");


    const network =
      parts[0];

    const prefix =
      Number(parts[1]);


    if (!isValidIPv4(ip)) {

      return false;

    }


    const ipInt =
      ipToInt(ip);

    const networkInt =
      ipToInt(network);


    const mask =

      prefix === 0

        ? 0

        : (0xffffffff <<
            (32 - prefix)) >>> 0;


    return (

      (ipInt & mask) ===
      (networkInt & mask)

    );

  }


  return ip === source;

}


/* =========================================================
   MATCH PROTOCOLO
========================================================= */

function matchProtocol(
  testProtocol,
  ruleProtocol
) {

  if (ruleProtocol === "ip") {

    return true;

  }


  return (
    testProtocol === ruleProtocol
  );

}


/* =========================================================
   MATCH PUERTO
========================================================= */

function matchPort(
  testPort,
  rulePort
) {

  /*
     Si la regla no tiene puerto,
     no se verifica puerto.
  */

  if (!rulePort) {

    return true;

  }


  return (

    String(testPort) ===
    String(rulePort)

  );

}


/* =========================================================
   CONVERTIR DIRECCIÓN A CISCO
========================================================= */

function addressToCisco(address) {


  if (address === "any") {

    return "any";

  }


  if (address.startsWith("host ")) {

    return address;

  }


  if (!address.includes("/")) {

    return `host ${address}`;

  }


  const parts =
    address.split("/");


  const network =
    parts[0];

  const prefix =
    Number(parts[1]);


  const mask =

    prefix === 0

      ? 0

      : (0xffffffff <<
          (32 - prefix)) >>> 0;


  const wildcard =
    (~mask) >>> 0;


  const octets = [

    (wildcard >>> 24) & 255,

    (wildcard >>> 16) & 255,

    (wildcard >>> 8) & 255,

    wildcard & 255

  ];


  return (
    `${network} ${octets.join(".")}`
  );

}


/* =========================================================
   VALIDACIÓN NÚMERO ACL
========================================================= */

function isValidACLNumber(
  number,
  type
) {

  const n =
    Number(number);


  if (!Number.isInteger(n)) {

    return false;

  }


  /* ACL ESTÁNDAR */

  if (type === "standard") {

    return (

      (n >= 1 && n <= 99) ||

      (n >= 1300 && n <= 1999)

    );

  }


  /* ACL EXTENDIDA */

  if (type === "extended") {

    return (

      (n >= 100 && n <= 199) ||

      (n >= 2000 && n <= 2699)

    );

  }


  return false;

}


/* =========================================================
   RENUMERAR REGLAS
========================================================= */

function normalizeRuleIds() {

  aclState.rules.forEach(
    function(rule, index) {

      rule.id =
        index + 1;

    }
  );

}


/* =========================================================
   TEXTO DE REGLA
========================================================= */

function getRuleText(rule) {


  if (
    aclState.type === "standard"
  ) {

    return (

      `${rule.action.toUpperCase()} ` +
      `${addressToCisco(rule.src)}`

    );

  }


  let text =

    `${rule.action.toUpperCase()} ` +
    `${rule.proto.toUpperCase()} ` +
    `${addressToCisco(rule.src)} ` +
    `${addressToCisco(rule.dst)}`;


  if (

    (

      rule.proto === "tcp" ||

      rule.proto === "udp"

    ) &&

    rule.port

  ) {

    text +=
      ` eq ${rule.port}`;

  }


  return text;

}


/* =========================================================
   RENDER CLI
========================================================= */

function renderCLI() {

  normalizeRuleIds();


  let cli = "";


  aclState.rules.forEach(
    function(rule) {

      cli +=

        `access-list ${aclState.number} ` +
        `${getRuleText(rule).toLowerCase()}\n`;

    }
  );


  cli += "\n";


  cli +=
    `interface ${aclState.interfaceName}\n`;


  cli +=
    ` ip access-group ` +
    `${aclState.number} ` +
    `${aclState.direction}`;


  document.getElementById(
    "cliOutput"
  ).textContent = cli;


  document.getElementById(
    "aclNumber"
  ).value =
    aclState.number;


  document.getElementById(
    "aclType"
  ).value =

    aclState.type === "standard"
      ? "Estándar"
      : "Extendida";


  document.getElementById(
    "interfaceName"
  ).value =
    aclState.interfaceName;


  document.getElementById(
    "direction"
  ).value =
    aclState.direction;

}


/* =========================================================
   RENDER REGLAS
========================================================= */

function renderRules() {

  normalizeRuleIds();


  const container =
    document.getElementById(
      "rulesContainer"
    );


  container.innerHTML = "";


  aclState.rules.forEach(
    function(rule, index) {


      const div =
        document.createElement(
          "div"
        );


      div.className =
        "rule";


      div.innerHTML = `

        <div class="rule-number">
          ${index + 1}
        </div>

        <div class="rule-text">
          ${getRuleText(rule)}
        </div>

        <div class="rule-actions">

          <button
            class="small"
            onclick="moveRule(${rule.id}, -1)"
            title="Subir">
            ▲
          </button>

          <button
            class="small"
            onclick="moveRule(${rule.id}, 1)"
            title="Bajar">
            ▼
          </button>

          <button
            class="small"
            onclick="deleteRule(${rule.id})"
            title="Eliminar">
            ✕
          </button>

        </div>

      `;


      container.appendChild(div);

    }
  );

}


/* =========================================================
   MOVER REGLA
========================================================= */

function moveRule(
  id,
  direction
) {

  const index =
    aclState.rules.findIndex(
      rule => rule.id === id
    );


  if (index === -1) {

    return;

  }


  const newIndex =
    index + direction;


  if (

    newIndex < 0 ||

    newIndex >=
      aclState.rules.length

  ) {

    return;

  }


  const temp =
    aclState.rules[index];


  aclState.rules[index] =
    aclState.rules[newIndex];


  aclState.rules[newIndex] =
    temp;


  normalizeRuleIds();


  updateUI();

}


/* =========================================================
   ELIMINAR REGLA
========================================================= */

function deleteRule(id) {

  aclState.rules =
    aclState.rules.filter(
      rule => rule.id !== id
    );


  normalizeRuleIds();


  updateUI();

}


/* =========================================================
   AGREGAR REGLA
========================================================= */

function addRule() {


  const action =
    document.getElementById(
      "ruleAction"
    ).value;


  const src =
    document.getElementById(
      "ruleSrc"
    ).value.trim();


  const dst =
    document.getElementById(
      "ruleDst"
    ).value.trim();


  const proto =
    document.getElementById(
      "ruleProto"
    ).value;


  const port =
    document.getElementById(
      "rulePort"
    ).value.trim();


  /* =======================================================
     ACL ESTÁNDAR
  ======================================================= */

  if (
    aclState.type === "standard"
  ) {


    if (
      src === ""
    ) {

      alert(
        "Debe indicar una IP o red de origen."
      );

      return;

    }


    if (
      !isValidAddress(src)
    ) {

      alert(
        "La IP o red de origen no es válida."
      );

      return;

    }


    aclState.rules.push({

      id:
        aclState.rules.length + 1,

      action:
        action,

      src:
        src,

      dst:
        "any",

      proto:
        "ip",

      port:
        ""

    });


  }


  /* =======================================================
     ACL EXTENDIDA
  ======================================================= */

  else {


    if (
      src === ""
    ) {

      alert(
        "Debe indicar una IP o red de origen."
      );

      return;

    }


    if (
      dst === ""
    ) {

      alert(
        "Debe indicar una IP o red de destino."
      );

      return;

    }


    if (
      !isValidAddress(src)
    ) {

      alert(
        "La IP o red de origen no es válida."
      );

      return;

    }


    if (
      !isValidAddress(dst)
    ) {

      alert(
        "La IP o red de destino no es válida."
      );

      return;

    }


    /* TCP / UDP */

    if (

      (
        proto === "tcp" ||
        proto === "udp"
      ) &&

      port

    ) {


      const portNumber =
        Number(port);


      if (

        !Number.isInteger(portNumber) ||

        portNumber < 1 ||

        portNumber > 65535

      ) {

        alert(
          "El puerto debe ser un número entero entre 1 y 65535."
        );

        return;

      }

    }


    /* ICMP / IP */

    if (

      (
        proto === "icmp" ||
        proto === "ip"
      ) &&

      port

    ) {

      alert(
        "ICMP e IP no utilizan puertos."
      );

      return;

    }


    aclState.rules.push({

      id:
        aclState.rules.length + 1,

      action:
        action,

      src:
        src,

      dst:
        dst,

      proto:
        proto,

      port:

        (
          proto === "tcp" ||
          proto === "udp"
        )

          ? port

          : ""

    });

  }


  normalizeRuleIds();


  document.getElementById(
    "ruleSrc"
  ).value = "";


  document.getElementById(
    "ruleDst"
  ).value = "";


  document.getElementById(
    "rulePort"
  ).value = "";


  updateUI();

}


/* =========================================================
   CARGAR ESCENARIO
========================================================= */

function loadScenario(
  key,
  button
) {


  const scenario =
    scenarios[key];


  aclState = {

    number:
      scenario.number,

    type:
      scenario.type,

    interfaceName:
      scenario.interfaceName,

    direction:
      scenario.direction,

    rules:
      scenario.rules.map(
        rule => ({ ...rule })
      )

  };


  document.getElementById(
    "testIP"
  ).value =
    scenario.testIP;


  document.getElementById(
    "testDstIP"
  ).value =
    scenario.testDstIP;


  document.getElementById(
    "testInIface"
  ).value =
    scenario.testInIface;


  document.getElementById(
    "testOutIface"
  ).value =
    scenario.testOutIface;


  document.getElementById(
    "testProto"
  ).value =
    scenario.proto;


  document.getElementById(
    "testPort"
  ).value =
    scenario.port;


  document
    .querySelectorAll(
      ".scenario-btn"
    )
    .forEach(
      btn =>
        btn.classList.remove(
          "active"
        )
    );


  button.classList.add(
    "active"
  );


  updateUI();


  clearResults();

}


/* =========================================================
   ACTUALIZAR INTERFAZ
========================================================= */

function updateUI() {

  normalizeRuleIds();

  renderRules();

  renderCLI();

  updateRuleForm();

  renderPacketPath();

}


/* =========================================================
   ACTUALIZAR CONFIGURACIÓN ACL
========================================================= */

function updateACLConfig() {

  aclState.interfaceName =
    document.getElementById(
      "interfaceName"
    ).value;


  aclState.direction =
    document.getElementById(
      "direction"
    ).value;


  renderCLI();


  renderPacketPath();

}


/* =========================================================
   VALIDAR NÚMERO ACL
========================================================= */

function validateACLNumber() {

  const input =
    document.getElementById(
      "aclNumber"
    );


  const value =
    input.value.trim();


  if (
    !isValidACLNumber(
      value,
      aclState.type
    )
  ) {

    alert(

      aclState.type === "standard"

        ? "Número de ACL estándar inválido. Use 1–99 o 1300–1999."

        : "Número de ACL extendida inválido. Use 100–199 o 2000–2699."

    );


    input.value =
      aclState.number;


    return;

  }


  aclState.number =
    value;


  renderCLI();


  renderPacketPath();

}


/* =========================================================
   ACTUALIZAR FORMULARIO DE REGLA
========================================================= */

function updateRuleForm() {


  const standard =
    aclState.type === "standard";


  const protocol =
    document.getElementById(
      "ruleProto"
    ).value;


  /* PROTOCOLO */

  document.getElementById(
    "protocolContainer"
  ).style.display =
    standard
      ? "none"
      : "block";


  /* DESTINO */

  document.getElementById(
    "destinationContainer"
  ).style.display =
    standard
      ? "none"
      : "block";


  /* PUERTO */

  const showPort =

    !standard &&

    (
      protocol === "tcp" ||
      protocol === "udp"
    );


  document.getElementById(
    "portContainer"
  ).style.display =
    showPort
      ? "block"
      : "none";


  /* Si no utiliza puerto,
     limpiamos el campo */

  if (!showPort) {

    document.getElementById(
      "rulePort"
    ).value = "";

  }

}


/* =========================================================
   ACTUALIZAR PUERTO DEL TEST
========================================================= */

function updateTestPort() {


  const protocol =
    document.getElementById(
      "testProto"
    ).value;


  const showPort =

    protocol === "tcp" ||
    protocol === "udp";


  document.getElementById(
    "testPortContainer"
  ).style.display =
    showPort
      ? "block"
      : "none";


  if (!showPort) {

    document.getElementById(
      "testPort"
    ).value = "";

  }

}


/* =========================================================
   PATH DEL PAQUETE
========================================================= */

function renderPacketPath() {


  const source =
    document.getElementById(
      "testIP"
    ).value;


  const destination =
    document.getElementById(
      "testDstIP"
    ).value;


  const inIface =
    document.getElementById(
      "testInIface"
    ).value;


  const outIface =
    document.getElementById(
      "testOutIface"
    ).value;


  const interfaceNames = {

    "Serial0/0/0":
      "INTERNET",

    "FastEthernet0/0":
      "LAN",

    "FastEthernet0/1":
      "DMZ / SERVIDORES"

  };


  document.getElementById(
    "packetPath"
  ).innerHTML = `

    <div class="path-node">

      📦<br>

      <strong>
        ${source}
      </strong>

      <br>

      Origen

    </div>


    <div class="path-arrow">
      →
    </div>


    <div class="path-node">

      🔌<br>

      <strong>
        ${inIface}
      </strong>

      <br>

      ${interfaceNames[inIface]}

      <br>

      IN

    </div>


    <div class="path-arrow">
      →
    </div>


    <div class="path-node">

      🖥️<br>

      <strong>
        ROUTER
      </strong>

    </div>


    <div class="path-arrow">
      →
    </div>


    <div class="path-node">

      🔌<br>

      <strong>
        ${outIface}
      </strong>

      <br>

      ${interfaceNames[outIface]}

      <br>

      OUT

    </div>


    <div class="path-arrow">
      →
    </div>


    <div class="path-node">

      🎯<br>

      <strong>
        ${destination}
      </strong>

      <br>

      Destino

    </div>

  `;

}


/* =========================================================
   RESULTADOS
========================================================= */

function clearResults() {

  document.getElementById(
    "results"
  ).innerHTML = "";

}


function appendLogLine(
  text,
  className = "log-eval"
) {


  const div =
    document.createElement(
      "div"
    );


  div.className =
    `log-line ${className}`;


  div.textContent =
    text;


  document
    .getElementById(
      "results"
    )
    .appendChild(div);

}


/* =========================================================
   SIMULACIÓN
========================================================= */

function runSimulation() {


  clearResults();


  const testIP =
    document.getElementById(
      "testIP"
    ).value.trim();


  const testDstIP =
    document.getElementById(
      "testDstIP"
    ).value.trim();


  const testInIface =
    document.getElementById(
      "testInIface"
    ).value;


  const testOutIface =
    document.getElementById(
      "testOutIface"
    ).value;


  const testProto =
    document.getElementById(
      "testProto"
    ).value;


  const testPort =
    document.getElementById(
      "testPort"
    ).value.trim();


  const interfaceNames = {

    "Serial0/0/0":
      "INTERNET",

    "FastEthernet0/0":
      "LAN",

    "FastEthernet0/1":
      "DMZ / SERVIDORES"

  };


  /* =======================================================
     VALIDAR IP ORIGEN
  ======================================================= */

  if (!isValidIPv4(testIP)) {

    appendLogLine(

      `❌ IP de origen no válida: ${testIP}`,

      "log-match-deny"

    );

    return;

  }


  /* =======================================================
     VALIDAR IP DESTINO
  ======================================================= */

  if (!isValidIPv4(testDstIP)) {

    appendLogLine(

      `❌ IP de destino no válida: ${testDstIP}`,

      "log-match-deny"

    );

    return;

  }


  /* =======================================================
     VALIDAR PUERTO
  ======================================================= */

  if (

    (
      testProto === "tcp" ||
      testProto === "udp"
    ) &&

    testPort

  ) {


    const portNumber =
      Number(testPort);


    if (

      !Number.isInteger(portNumber) ||

      portNumber < 1 ||

      portNumber > 65535

    ) {

      appendLogLine(

        `❌ Puerto no válido: ${testPort}. ` +
        `Debe estar entre 1 y 65535.`,

        "log-match-deny"

      );

      return;

    }

  }


  /* ICMP / IP NO TIENEN PUERTO */

  if (

    (
      testProto === "icmp" ||
      testProto === "ip"
    ) &&

    testPort

  ) {

    appendLogLine(

      `❌ ${testProto.toUpperCase()} ` +
      `no utiliza puertos.`,

      "log-match-deny"

    );

    return;

  }


  /* =======================================================
     INFORMACIÓN DEL PAQUETE
  ======================================================= */

  appendLogLine(

    `📦 [PAQUETE] ` +
    `${testIP} → ${testDstIP}`

  );


  appendLogLine(

    `🔌 [TRÁNSITO] ` +
    `${testInIface} ` +
    `(${interfaceNames[testInIface]}) IN ` +
    `→ ROUTER → ` +
    `${testOutIface} ` +
    `(${interfaceNames[testOutIface]}) OUT`

  );


  appendLogLine(

    `🌐 [PROTOCOLO] ` +
    `${testProto.toUpperCase()}` +

    (
      testPort
        ? ` / puerto ${testPort}`
        : ""
    )

  );


  /* =======================================================
     ¿APLICA LA ACL?
  ======================================================= */

  const aclApplies =

    (

      aclState.direction === "in" &&

      testInIface ===
        aclState.interfaceName

    )

    ||

    (

      aclState.direction === "out" &&

      testOutIface ===
        aclState.interfaceName

    );


  if (!aclApplies) {


    appendLogLine(

      `⚪ [ACL] No aplica a este paquete.`,

      "log-eval"

    );


    appendLogLine(

      `La ACL ${aclState.number} ` +
      `está aplicada en ` +
      `${aclState.interfaceName} ` +
      `${interfaceNames[aclState.interfaceName]} ` +
      `${aclState.direction.toUpperCase()}.`,

      "log-eval"

    );


    appendLogLine(

      `El paquete continúa hacia ` +
      `${testDstIP}.`,

      "log-match-permit"

    );


    return;

  }


  /* =======================================================
     ACL APLICA
  ======================================================= */

  appendLogLine(

    `🛡️ [ACL ${aclState.number}] ` +
    `Se evalúa en ` +
    `${aclState.interfaceName} ` +
    `(${interfaceNames[aclState.interfaceName]}) ` +
    `${aclState.direction.toUpperCase()}.`,

    "log-match"

  );


  if (
    aclState.direction === "in"
  ) {

    appendLogLine(

      `⬅️ [IN] La ACL se evalúa ` +
      `cuando el paquete entra por ` +
      `${aclState.interfaceName}.`,

      "log-eval"

    );

  }

  else {

    appendLogLine(

      `➡️ [OUT] La ACL se evalúa ` +
      `cuando el paquete sale por ` +
      `${aclState.interfaceName}.`,

      "log-eval"

    );

  }


  /* =======================================================
     EVALUACIÓN DE REGLAS
  ======================================================= */

  let matchedRule = null;


  for (
    let i = 0;
    i < aclState.rules.length;
    i++
  ) {


    const rule =
      aclState.rules[i];


    let matches = false;


    /* =====================================================
       ACL ESTÁNDAR
    ===================================================== */

    if (
      aclState.type === "standard"
    ) {


      matches =
        matchAddress(
          testIP,
          rule.src
        );

    }


    /* =====================================================
       ACL EXTENDIDA
    ===================================================== */

    else {


      const sourceMatch =
        matchAddress(
          testIP,
          rule.src
        );


      const destinationMatch =
        matchAddress(
          testDstIP,
          rule.dst
        );


      const protocolMatch =
        matchProtocol(
          testProto,
          rule.proto
        );


      let portMatch = true;


      if (

        (
          rule.proto === "tcp" ||
          rule.proto === "udp"
        ) &&

        rule.port

      ) {

        portMatch =
          matchPort(
            testPort,
            rule.port
          );

      }


      matches =

        sourceMatch &&

        destinationMatch &&

        protocolMatch &&

        portMatch;

    }


    appendLogLine(

      `🔎 [REGLA ${i + 1}] ` +
      `${getRuleText(rule)} → ` +
      `${matches ? "MATCH" : "NO MATCH"}`,

      matches
        ? "log-match"
        : "log-eval"

    );


    if (matches) {

      matchedRule =
        rule;

      break;

    }

  }


  /* =======================================================
     RESULTADO
  ======================================================= */

  if (matchedRule) {


    appendLogLine(

      `🎯 [MATCH] Coincide con ` +
      `la regla ${matchedRule.id}.`,

      "log-match"

    );


    if (
      matchedRule.action === "deny"
    ) {


      appendLogLine(

        `🔴 [ACCIÓN] DENY — ` +
        `El paquete es descartado.`,

        "log-match-deny"

      );

    }

    else {


      appendLogLine(

        `🟢 [ACCIÓN] PERMIT — ` +
        `El paquete continúa hacia ` +
        `${testDstIP}.`,

        "log-match-permit"

      );

    }

  }


  /* =======================================================
     DENY IMPLÍCITO
  ======================================================= */

  else {


    appendLogLine(

      `⚫ [IMPLICIT DENY] ` +
      `Ninguna regla coincide.`,

      "log-eval"

    );


    appendLogLine(

      `🔴 [ACCIÓN] DENY — ` +
      `El paquete es descartado ` +
      `por el deny implícito.`,

      "log-match-deny"

    );

  }

}


/* =========================================================
   EVENTOS TESTER
========================================================= */

[

  "testIP",

  "testDstIP",

  "testInIface",

  "testOutIface"

].forEach(function(id) {


  document
    .getElementById(id)
    .addEventListener(
      "input",
      renderPacketPath
    );


  document
    .getElementById(id)
    .addEventListener(
      "change",
      renderPacketPath
    );

});


/* =========================================================
   PROTOCOLO DEL TESTER
========================================================= */

document
  .getElementById("testProto")
  .addEventListener(
    "change",
    function() {

      updateTestPort();

      renderPacketPath();

    }
  );


/* =========================================================
   CONFIGURACIÓN ACL
========================================================= */

/*
 * El número ACL se valida con CHANGE
 * para permitir escribir números como
 * 1300, 1999, 2000, etc. sin que el
 * campo se modifique mientras se escribe.
 */

document
  .getElementById("aclNumber")
  .addEventListener(
    "change",
    validateACLNumber
  );


document
  .getElementById("interfaceName")
  .addEventListener(
    "change",
    updateACLConfig
  );


document
  .getElementById("direction")
  .addEventListener(
    "change",
    updateACLConfig
  );


/* =========================================================
   INICIO
========================================================= */

loadScenario(

  "standard",

  document.getElementById(
    "scenarioStandard"
  )

);

</script>
